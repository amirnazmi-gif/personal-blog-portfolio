<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Amir Nazmi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">AN.Dev</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
        <button id="theme-toggle">🌓 Mode</button>
    </header>

    <main style="padding: 4rem 10%; max-width: 800px; margin: 0 auto;">
        <h2 style="margin-bottom: 2rem; border-left: 5px solid var(--primary-color); padding-left: 10px;">Get In Touch</h2>
        
        <form style="background-color: var(--card-bg); padding: 2rem; border: 1px solid var(--border-color); border-radius: 8px; display: flex; flex-direction: column; gap: 1.5rem;">
            <div>
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Name</label>
                <input type="text" placeholder="Your Name" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--bg-color); color: var(--text-color);" required>
            </div>
            <div>
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Email</label>
                <input type="email" placeholder="yourname@email.com" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--bg-color); color: var(--text-color);" required>
            </div>
            <div>
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Message</label>
                <textarea rows="5" placeholder="Let's talk about projects or opportunities..." style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--bg-color); color: var(--text-color);" required></textarea>
            </div>
            <button type="submit" class="btn" style="border: none; cursor: pointer; align-self: flex-start;">Send Message</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Muhammad Amir Nazmi. Built for CSD34203 Portfolio.</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
